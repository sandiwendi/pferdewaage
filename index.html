<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminbuchung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      padding: 24px;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    h1, h2 {
      margin-top: 0;
    }
    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .info-box {
      background: #eef2f7;
      border-radius: 12px;
      padding: 14px;
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      align-items: end;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }
    button {
      border: none;
      background: #0f766e;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover { opacity: 0.92; }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .secondary {
      background: #334155;
    }
    .danger {
      background: #b91c1c;
      width: auto;
      padding: 8px 12px;
      font-size: 14px;
    }
    .message {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      display: none;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 14px;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      background: #f8fafc;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #075985;
      font-size: 13px;
      font-weight: 700;
    }
    .empty {
      color: #64748b;
      padding: 16px 0 4px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Terminbuchung</h1>
      <p>Für einen Tag stehen maximal 10 Termine im 15-Minuten-Rhythmus zur Verfügung. Start ist um 10:00 Uhr.</p>
      <div class="info">
        <div class="info-box"><strong>Datum:</strong><br><span id="bookingDateText"></span></div>
        <div class="info-box"><strong>Start:</strong><br>10:00 Uhr</div>
        <div class="info-box"><strong>Rhythmus:</strong><br>15 Minuten</div>
        <div class="info-box"><strong>Max. Termine:</strong><br>10</div>
      </div>
    </div>

    <div class="card">
      <h2>Termin buchen</h2>
      <form id="bookingForm">
        <div>
          <label for="bookingDate">Datum</label>
          <input type="date" id="bookingDate" required />
        </div>
        <div>
          <label for="slot">Termin</label>
          <select id="slot" required></select>
        </div>
        <div>
          <label for="personName">Name der Person</label>
          <input type="text" id="personName" placeholder="z. B. Sandra Harrer" required />
        </div>
        <div>
          <label for="animalName">Name des Tiers</label>
          <input type="text" id="animalName" placeholder="z. B. Thorin" required />
        </div>
        <div>
          <button type="submit" id="submitBtn">Termin speichern</button>
        </div>
      </form>
      <div id="message" class="message"></div>
    </div>

    <div class="card">
      <h2>Gebuchte Termine</h2>
      <div id="countInfo"></div>
      <div id="tableWrapper"></div>
      <div class="actions">
        <button class="secondary" id="exportBtn">Buchungen exportieren (JSON)</button>
        <button class="secondary" id="clearBtn">Alle Buchungen löschen</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_TERMS = 10;
    const START_HOUR = 10;
    const INTERVAL_MINUTES = 15;
    const STORAGE_KEY = 'terminbuchung_data_v1';

    const bookingDateInput = document.getElementById('bookingDate');
    const bookingDateText = document.getElementById('bookingDateText');
    const slotSelect = document.getElementById('slot');
    const personNameInput = document.getElementById('personName');
    const animalNameInput = document.getElementById('animalName');
    const bookingForm = document.getElementById('bookingForm');
    const tableWrapper = document.getElementById('tableWrapper');
    const messageBox = document.getElementById('message');
    const countInfo = document.getElementById('countInfo');
    const submitBtn = document.getElementById('submitBtn');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    function getTodayString() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString + 'T00:00:00');
      return date.toLocaleDateString('de-AT', {
        weekday: 'long',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    function generateSlots() {
      const slots = [];
      let hour = START_HOUR;
      let minute = 0;

      for (let i = 0; i < MAX_TERMS; i++) {
        const start = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        minute += INTERVAL_MINUTES;
        while (minute >= 60) {
          minute -= 60;
          hour += 1;
        }
        slots.push(start);
      }
      return slots;
    }

    function loadBookings() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveBookings(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getBookingsForDate(date) {
      const data = loadBookings();
      return data[date] || [];
    }

    function setBookingsForDate(date, bookings) {
      const data = loadBookings();
      data[date] = bookings;
      saveBookings(data);
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function clearMessage() {
      messageBox.textContent = '';
      messageBox.className = 'message';
    }

    function updateSlotOptions() {
      const selectedDate = bookingDateInput.value;
      const bookings = getBookingsForDate(selectedDate);
      const bookedTimes = bookings.map(b => b.slot);
      const slots = generateSlots();

      slotSelect.innerHTML = '';

      const freeSlots = slots.filter(slot => !bookedTimes.includes(slot));

      if (freeSlots.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Keine freien Termine verfügbar';
        slotSelect.appendChild(option);
        submitBtn.disabled = true;
      } else {
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Bitte Termin auswählen';
        placeholder.selected = true;
        placeholder.disabled = true;
        slotSelect.appendChild(placeholder);

        freeSlots.forEach(slot => {
          const option = document.createElement('option');
          option.value = slot;
          option.textContent = slot + ' Uhr';
          slotSelect.appendChild(option);
        });
        submitBtn.disabled = false;
      }
    }

    function renderBookings() {
      const selectedDate = bookingDateInput.value;
      const bookings = getBookingsForDate(selectedDate)
        .sort((a, b) => a.slot.localeCompare(b.slot));

      bookingDateText.textContent = formatDate(selectedDate);
      countInfo.innerHTML = `<p><strong>${bookings.length}</strong> von <strong>${MAX_TERMS}</strong> Terminen gebucht.</p>`;

      if (bookings.length === 0) {
        tableWrapper.innerHTML = '<p class="empty">Noch keine Termine gebucht.</p>';
        return;
      }

      const rows = bookings.map((booking, index) => `
        <tr>
          <td><span class="pill">${booking.slot} Uhr</span></td>
          <td>${escapeHtml(booking.personName)}</td>
          <td>${escapeHtml(booking.animalName)}</td>
          <td><button class="danger" onclick="deleteBooking(${index})">Löschen</button></td>
        </tr>
      `).join('');

      tableWrapper.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Termin</th>
              <th>Person</th>
              <th>Tier</th>
              <th>Aktion</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.deleteBooking = function(index) {
      const selectedDate = bookingDateInput.value;
      const bookings = getBookingsForDate(selectedDate);
      bookings.splice(index, 1);
      setBookingsForDate(selectedDate, bookings);
      updateSlotOptions();
      renderBookings();
      showMessage('Termin wurde gelöscht.', 'success');
    }

    bookingForm.addEventListener('submit', function(e) {
      e.preventDefault();
      clearMessage();

      const selectedDate = bookingDateInput.value;
      const slot = slotSelect.value;
      const personName = personNameInput.value.trim();
      const animalName = animalNameInput.value.trim();

      if (!selectedDate || !slot || !personName || !animalName) {
        showMessage('Bitte alle Felder ausfüllen.', 'error');
        return;
      }

      const bookings = getBookingsForDate(selectedDate);

      if (bookings.length >= MAX_TERMS) {
        showMessage('Für diesen Tag sind bereits alle 10 Termine vergeben.', 'error');
        return;
      }

      if (bookings.some(b => b.slot === slot)) {
        showMessage('Dieser Termin ist bereits vergeben.', 'error');
        updateSlotOptions();
        return;
      }

      bookings.push({ slot, personName, animalName });
      setBookingsForDate(selectedDate, bookings);

      personNameInput.value = '';
      animalNameInput.value = '';
      updateSlotOptions();
      renderBookings();
      showMessage('Termin erfolgreich gebucht.', 'success');
    });

    bookingDateInput.addEventListener('change', () => {
      clearMessage();
      updateSlotOptions();
      renderBookings();
    });

    exportBtn.addEventListener('click', () => {
      const data = loadBookings();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'terminbuchungen.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener('click', () => {
      const selectedDate = bookingDateInput.value;
      const data = loadBookings();
      delete data[selectedDate];
      saveBookings(data);
      updateSlotOptions();
      renderBookings();
      showMessage('Alle Buchungen für den gewählten Tag wurden gelöscht.', 'success');
    });

    bookingDateInput.value = getTodayString();
    bookingDateInput.min = getTodayString();
    updateSlotOptions();
    renderBookings();
  </script>
</body>
</html>
